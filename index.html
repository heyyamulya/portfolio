<input name="email" type="email" autocomplete="email" value=${gbEmail} onInput=${onGbEmail} placeholder="you@email.com" style="min-height: 38px; padding: 0 10px; border: 0; border-bottom: 2px solid #8E1B2E; background: #FFFFFF; color: #2A1A1E; font-family: 'Syne', sans-serif; font-size: 14px" />
</label>
</div>
<button type="submit" style="align-self: flex-start; min-height: 40px; padding: 0 18px; border: 0; border-radius: 999px; background: #8E1B2E; color: #F6D58E; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer">sign the book ✶</button>
</form>
<div style="padding: 0 16px 14px; display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Special Elite', monospace; font-size: 13px; padding-top: 10px; border-top: 2px solid #8E1B2E; color: #8E1B2E">VISITOR LOG</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; font-family: 'Space Mono', monospace">
<div style="padding: 8px; background: #F6D58E; color: #2A1A1E; display: flex; flex-direction: column"><span style="font-size: 9px; font-weight: 700">VISITS</span><span style="font-family: 'Zen Dots', sans-serif; font-size: 20px">${vlog.visits}</span></div>
<div style="padding: 8px; background: #F2B8C6; color: #2A1A1E; display: flex; flex-direction: column"><span style="font-size: 9px; font-weight: 700">SIGNED</span><span style="font-family: 'Zen Dots', sans-serif; font-size: 20px">${vlog.signed}</span></div>
<div style="padding: 8px; background: #8E1B2E; color: #F6D58E; display: flex; flex-direction: column"><span style="font-size: 9px; font-weight: 700">YOU ARE VISIT</span><span style="font-family: 'Zen Dots', sans-serif; font-size: 20px">#${vlog.you}</span></div>
</div>
<span style="font-family: 'Space Mono', monospace; font-size: 10px; color: #6B5A5E">first visit ${vlog.first} · last ${vlog.last} · ${build.version} (built ${build.date})</span>
<div style="max-height: 140px; overflow: auto; display: flex; flex-direction: column; font-family: 'Space Mono', monospace; font-size: 11px">
${(visitors || []).map((vv, $index) => html`<div style="display: flex; gap: 10px; height: 26px; align-items: center; border-bottom: 1px solid rgba(142,27,46,0.18)"><span style="color: #8E1B2E">#${vv.n}</span><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'Homemade Apple', cursive; font-size: 13px">${vv.name}</span><span style="color: #6B5A5E">${vv.when}</span></div>`)}
</div>
</div>
</div>
</div>
` : null}
</div>

</main>


${(hasSel) ? html`
<div style="position: fixed; left: 16px; bottom: 16px; z-index: 60; display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px; background: ${t.tape}; color: #2A2233; font-family: 'Space Mono', monospace; font-size: 11px; transform: rotate(-1.5deg); box-shadow: 0 3px 8px rgba(0,0,0,0.2)">
<span>${hud.name}</span>
<button type="button" aria-label="Rotate left" onClick=${rotL} style="width: 30px; height: 30px; border: 1px solid #2A2233; background: transparent; cursor: pointer">↺</button>
<button type="button" aria-label="Rotate right" onClick=${rotR} style="width: 30px; height: 30px; border: 1px solid #2A2233; background: transparent; cursor: pointer">↻</button>
<button type="button" onClick=${resetAll} style="height: 30px; padding: 0 8px; border: 1px solid #2A2233; background: transparent; cursor: pointer">tidy up</button>
</div>
` : null}
` : null}


${(cur.seen) ? html`
<div aria-hidden="true" style="position: absolute; left: ${cur.lx}; top: ${cur.ly}; z-index: 90; pointer-events: none; display: flex; flex-direction: column; gap: 2px; font-family: 'Space Mono', monospace; font-size: 10px; line-height: 1.2; color: ${t.tagInk}; text-shadow: 0 1px 2px ${t.tagShadow}; white-space: nowrap">
<span>+ ${cur.x}, ${cur.y}</span>
${(hud.dragging) ? html`<span>${hud.name} @ ${hud.x}, ${hud.y} · ${hud.r}°</span>` : null}
</div>
` : null}

<span aria-hidden="true" style="position: absolute; right: 24px; bottom: 26px; z-index: 6; font-family: 'Space Mono', monospace; font-size: 10px; color: ${t.tagInk}; text-shadow: 0 1px 2px ${t.tagShadow}">${build.version} · built ${build.date} · ${vlog.visits} visits</span>
<span aria-hidden="true" style="position: absolute; right: 24px; bottom: 10px; z-index: 6; font-family: 'Space Mono', monospace; font-size: 10px; color: ${t.tagInk}; text-shadow: 0 1px 2px ${t.tagShadow}">33.75° N, 84.39° W</span>


${(showBoot) ? html`
<div style="position: fixed; inset: 0; z-index: 100; background: #070914; color: #E8EEF6; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; font-family: 'Space Mono', monospace">
<div style="width: 100%; max-width: 620px; display: flex; flex-direction: column; gap: 22px">
<pre style="color: #A9D6F5; font-size: clamp(9px, 2.2vw, 15px); line-height: 1.15">${PRE_7}</pre>
<div aria-live="polite" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; min-height: 130px">
${(bootLines || []).map((bl, $index) => html`<span style="animation: fadein .3s ease">${bl.t}</span>`)}
<span aria-hidden="true" style="width: 9px; height: 16px; background: #A9D6F5; animation: blink 1s steps(1) infinite"></span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
${(bootDone) ? html`<button type="button" ref=${setStartBtn} onClick=${start} style="min-height: 54px; padding: 0 26px; border: 2px solid #A9D6F5; background: transparent; color: #A9D6F5; font-family: 'Zen Dots', sans-serif; font-size: 18px; letter-spacing: 0.06em; cursor: pointer; animation: fadein .4s ease">[ press start ]</button>` : null}
<button type="button" onClick=${skipIntro} style="min-height: 40px; padding: 0 8px; border: 0; background: transparent; color: #8A93AD; font-size: 12px; text-decoration: underline; cursor: pointer">skip</button>
</div>
</div>
</div>
` : null}


${(showLetter) ? html`
<div style="position: fixed; inset: 0; z-index: 100; background: rgba(20,14,30,0.72); display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
<div style="position: relative; width: 100%; max-width: 720px; box-sizing: border-box; padding: 44px 44px 32px; background: #FFFBF1; color: #1F1A26; box-shadow: 0 20px 50px rgba(0,0,0,0.45); transform: rotate(-1deg); display: flex; flex-direction: column; gap: 18px">
<span aria-hidden="true" style="position: absolute; left: 50%; top: -12px; width: 110px; height: 24px; margin-left: -55px; background: rgba(255,231,168,0.9); transform: rotate(2deg)"></span>
<div aria-live="polite" style="min-height: 300px; display: flex; flex-direction: column; gap: 0">
${(letter || []).map((ln, $index) => html`
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 16px; min-height: 40px">
${(ln.words || []).map((w, $index) => html`<span style="font-family: ${w.font}; font-size: ${w.size}; font-weight: 700; line-height: 1.08; letter-spacing: -0.01em">${w.text}</span>`)}
${(ln.caret) ? html`<span aria-hidden="true" style="display: inline-block; width: 3px; height: 32px; background: #1F1A26; animation: blink 1s steps(1) infinite"></span>` : null}
</div>
`)}
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
<button type="button" onClick=${skipIntro} style="min-height: 40px; padding: 0 12px; border: 0; background: transparent; font-family: 'Space Mono', monospace; font-size: 12px; text-decoration: underline; cursor: pointer">skip</button>
${(introDone) ? html`
<button type="button" ref=${setStartBtn} onClick=${start} style="width: 84px; height: 84px; border-radius: 50%; border: 0; background: #B3122E; color: #FFE7A8; font-family: 'Shrikhand', serif; font-size: 18px; cursor: pointer; box-shadow: inset 0 0 0 6px rgba(0,0,0,0.12), 0 6px 14px rgba(0,0,0,0.3); animation: fadein .4s ease">open ✶</button>
` : null}
</div>
</div>
</div>
` : null}

</div>`;
  }
}


render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
